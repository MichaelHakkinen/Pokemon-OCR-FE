name: pokemon_ocr_fe
description: Cross-platform Pokemon TCG scanner, collection manager, and dynamic CSV export app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  image: ^4.2.0
  csv: ^6.0.0
  share_plus: ^10.0.0
  path_provider: ^2.1.3
  http: ^1.2.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

